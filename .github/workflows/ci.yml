name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Compilar
        run: dotnet build src/DiskStudioSuite.csproj -c Release

      - name: Pruebas de los motores
        run: dotnet run --project tests -c Release
