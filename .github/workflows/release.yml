name: Release

# Se ejecuta al subir una etiqueta de versión, p. ej.:  git tag v0.1.0 && git push origin v0.1.0
# Las versiones 0.x se publican como «pre-release» (en pruebas).
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Versión (sin la «v»), p. ej. 0.1.1'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Versión
        id: ver
        shell: pwsh
        run: |
          $v = if ('${{ github.event_name }}' -eq 'workflow_dispatch') { '${{ inputs.version }}' } else { '${{ github.ref_name }}'.TrimStart('v') }
          if ($v -notmatch '^\d+\.\d+\.\d+') { throw "Versión no válida: $v" }
          "version=$v" >> $env:GITHUB_OUTPUT
          "tag=v$v" >> $env:GITHUB_OUTPUT
          "prerelease=$(if ($v.StartsWith('0.') -or $v.Contains('-')) { 'true' } else { 'false' })" >> $env:GITHUB_OUTPUT

      - name: Pruebas de los motores
        run: dotnet run --project tests -c Release

      - name: Publicar ejecutable único
        shell: pwsh
        run: |
          dotnet publish src/DiskStudioSuite.csproj -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true `
            -p:Version=${{ steps.ver.outputs.version }} -o dist
          Get-ChildItem dist -Exclude DiskStudioSuite.exe | Remove-Item -Recurse -Force

      - name: Crear el instalador
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress | Out-Null
          $iscc = @("${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe", "$env:ProgramFiles\Inno Setup 6\ISCC.exe") | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) { throw 'No se encontró ISCC.exe' }
          & $iscc /Q "/DAppVersion=${{ steps.ver.outputs.version }}" installer/DiskStudioSuite.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup terminó con el código $LASTEXITCODE" }
          Get-ChildItem dist | Format-Table Name, Length

      - name: Sumas SHA-256
        shell: pwsh
        run: |
          Get-ChildItem dist -Filter *.exe | ForEach-Object { "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)" } | Set-Content dist/SHA256SUMS.txt -Encoding ascii
          Get-Content dist/SHA256SUMS.txt

      - name: Crear la release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ steps.ver.outputs.tag }}'
          $ver = '${{ steps.ver.outputs.version }}'
          # Novedades de esta versión: su sección de CHANGELOG.md
          $changes = ''
          if (Test-Path CHANGELOG.md) {
            $m = [regex]::Match((Get-Content CHANGELOG.md -Raw -Encoding utf8), "(?ms)^## \[$([regex]::Escape($ver))\][^\n]*\n(.*?)(?=^## \[|\z)")
            if ($m.Success) { $changes = $m.Groups[1].Value.Trim() }
          }
          $notes = @"
          ## Disk Studio Suite $tag

          $changes

          ---

          Descarga **DiskStudioSuite-Setup-$ver.exe** para instalarlo (sin necesidad de administrador, con acceso en el menú Inicio y actualizaciones desde la propia app), o **DiskStudioSuite.exe** si prefieres la versión portable de un solo archivo. Ambos para Windows 10/11 de 64 bits.

          > Versión en pruebas: haz copia de seguridad antes de clonar, convertir o formatear discos.

          Comprueba la descarga con el SHA-256 de **SHA256SUMS.txt**.

          > El ejecutable no está firmado: si Windows SmartScreen avisa, pulsa *Más información → Ejecutar de todas formas*.
          "@
          $extra = @()
          if ('${{ steps.ver.outputs.prerelease }}' -eq 'true') { $extra += '--prerelease' }
          $notes | Set-Content release-notes.md -Encoding utf8
          gh release create $tag dist/DiskStudioSuite.exe "dist/DiskStudioSuite-Setup-$ver.exe" dist/SHA256SUMS.txt --title "Disk Studio Suite $tag" --notes-file release-notes.md --target ${{ github.sha }} @extra
